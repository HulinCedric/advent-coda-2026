name: .NET

on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # dorny/test-reporter creates a check run with the test results
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        
    - name: Restore
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release
      
    - name: Test
      # dotnet test fails on a solution without any project
      if: ${{ hashFiles('**/*.Tests.csproj') != '' }}
      run: dotnet test --no-build --configuration Release --results-directory "${{ github.workspace }}/TestResults"

    - name: Test report
      if: ${{ !cancelled() }}
      uses: dorny/test-reporter@v3
      with:
        name: Test results
        path: TestResults/*.trx
        reporter: dotnet-trx
        # no TRX file is produced when there is no test project
        fail-on-empty: false